name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate CSVs from the workbook
        run: python3 -I scripts/export_derived_data.py workbooks/NY_RES_rebid_crosswalk.xlsx data/derived
      - name: Committed CSVs match the workbook
        run: git diff --exit-code -- data/derived
      - name: Headline numbers reproduce
        run: python3 -I scripts/verify_headline_numbers.py data/derived/roster_117.csv
